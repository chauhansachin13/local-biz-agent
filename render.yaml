services:
  - type: web
    name: bizpresence-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./bizpresence.db
      - key: GEMINI_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
